<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" style="background:#0d1117; border-radius:8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <style>
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
    .subgraph { fill: #161b22; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 4; rx: 8px; }
    .title { fill: #58a6ff; font-weight: 600; font-size: 14px; }
    .sub-title { fill: #8b949e; font-weight: 600; font-size: 12px; }
    .node-text { fill: #c9d1d9; font-size: 12px; }
    .node-bold { fill: #f0f6fc; font-weight: 600; font-size: 13px; }
    .arrow { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .label { fill: #8b949e; font-size: 11px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e" />
    </marker>
  </defs>

  <!-- Subgraphs -->
  <!-- Browser / Client -->
  <rect x="20" y="40" width="220" height="150" class="subgraph" />
  <text x="35" y="62" class="sub-title">client [Browser]</text>
  <rect x="35" y="75" width="190" height="95" class="box" />
  <text x="45" y="98" class="node-bold">Next.js 14 App Router</text>
  <text x="45" y="118" class="node-text">React, Tailwind, shadcn</text>

  <!-- Server / FastAPI -->
  <rect x="290" y="40" width="250" height="360" class="subgraph" />
  <text x="305" y="62" class="sub-title">server [FastAPI]</text>
  
  <rect x="305" y="75" width="220" height="75" class="box" />
  <text x="315" y="98" class="node-bold">REST API</text>
  <text x="315" y="118" class="node-text">43 routes</text>

  <rect x="305" y="170" width="220" height="75" class="box" />
  <text x="315" y="193" class="node-bold">Background jobs</text>
  <text x="315" y="213" class="node-text">APScheduler</text>

  <rect x="305" y="265" width="220" height="75" class="box" />
  <text x="315" y="288" class="node-bold">Pricing service</text>
  <text x="315" y="308" class="node-text">scikit-learn</text>

  <!-- Data / Supabase -->
  <rect x="590" y="40" width="240" height="205" class="subgraph" />
  <text x="605" y="62" class="sub-title">data [Supabase]</text>
  
  <rect x="605" y="75" width="210" height="75" class="box" />
  <text x="615" y="98" class="node-bold">PostgreSQL</text>
  <text x="615" y="118" class="node-text">RLS enabled</text>

  <rect x="605" y="160" width="210" height="65" class="box" />
  <text x="615" y="198" class="node-bold">Object storage</text>

  <!-- External Services -->
  <rect x="20" y="260" width="180" height="65" class="box" />
  <text x="30" y="298" class="node-bold">Clerk auth</text>

  <rect x="20" y="345" width="180" height="65" class="box" />
  <text x="30" y="383" class="node-bold">Razorpay</text>

  <!-- Arrows & Connections -->
  <!-- Client -> FastAPI API -->
  <path d="M 225 110 L 305 110" class="arrow" />
  <text x="265" y="103" class="label">JWT bearer</text>

  <!-- Client -> Clerk -->
  <path d="M 125 170 L 125 260" class="arrow" />
  <text x="130" y="220" class="label" text-anchor="start">session</text>

  <!-- Client -> Razorpay -->
  <path d="M 80 170 L 80 345" class="arrow" />
  <text x="75" y="250" class="label" text-anchor="end">checkout</text>

  <!-- FastAPI API -> Clerk -->
  <path d="M 305 130 L 200 270" class="arrow" />
  <text x="235" y="195" class="label">verify JWT via JWKS</text>

  <!-- FastAPI API -> Supabase PG -->
  <path d="M 525 110 L 605 110" class="arrow" />
  <text x="565" y="103" class="label">service role key</text>

  <!-- FastAPI API -> Supabase Storage -->
  <path d="M 525 135 L 605 175" class="arrow" />

  <!-- FastAPI API -> Razorpay -->
  <path d="M 305 140 L 200 350" class="arrow" />
  <text x="240" y="265" class="label">orders, refunds</text>

  <!-- Razorpay -> FastAPI API (webhooks) -->
  <path d="M 200 375 L 305 145" class="arrow" />
  <text x="280" y="325" class="label">webhooks</text>

  <!-- Jobs -> Supabase PG -->
  <path d="M 525 205 L 605 145" class="arrow" />

  <!-- Jobs -> Razorpay -->
  <path d="M 305 210 L 195 345" class="arrow" />

  <!-- ML -> API -->
  <path d="M 415 265 L 415 150" class="arrow" />

</svg>
